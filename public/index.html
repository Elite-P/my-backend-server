<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SK82ND SkateShop — Skateboards, parts & accessories. Ván trượt mới, 2hand và phụ kiện skateboarding.">
<title>SK82ND SkateShop — Find Your Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

:root {
  --ink: #080D16;
  --paper: #FFFFFF;
  --muted: #64748B;
  --line: #DBE3EC;
  --lime: #38BDF8;
  --red: #0284C7;
  --white: #FFFFFF;

  --display: 'Barlow Condensed', Impact, sans-serif;
  --body: 'DM Sans', Arial, sans-serif;
}

body {
  background: #FFFFFF;
  color: #080D16;
}

header {
  background: rgba(255,255,255,.95);
}

.hero {
  background: #080D16;
}

.announce {
  background: #38BDF8;
  color: #080D16;
}

.logo span {
  color: #38BDF8;
}

.navlinks a:hover {
  color: #0284C7;
}

.product-visual {
  background: #EDF7FC;
}

.filter.active {
  background: #080D16;
  color: #FFFFFF;
}

.cta, .checkout {
  background: #38BDF8;
  color: #080D16;
}

.product-photo {
  width: 100%;
  height: 100%;
  position: absolute;
  inset: 0;
  object-fit: cover;
  z-index: 1;
}

.product-visual.has-image:before,
.product-visual.has-image:after {
  display: none;
}

.product-badge {
  z-index: 2;
}

.quick {
  z-index: 3;
}

/* CSS CHO MODAL CHI TIẾT KIỂU VIETGANGZ */
.product-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 9999;
  overflow-y: auto;
  padding: 24px 40px;
}
.product-modal.active {
  display: block;
}
.modal-close-btn {
  position: fixed;
  top: 20px;
  right: 30px;
  background: #111;
  color: #fff;
  border: none;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
  z-index: 10000;
}
.modal-layout {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
  max-width: 1300px;
  margin: 40px auto 0;
  align-items: start;
}
.modal-gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.modal-gallery img {
  width: 100%;
  height: auto;
  object-fit: cover;
  background: #f5f5f5;
  aspect-ratio: 1/1;
}
.modal-gallery.single-img {
  grid-template-columns: 1fr;
}
.modal-details {
  position: sticky;
  top: 40px;
}
.modal-title {
  font-size: 28px;
  font-weight: 800;
  margin: 0 0 10px 0;
  text-transform: uppercase;
}
.modal-price {
  font-size: 20px;
  font-weight: 600;
  margin: 0 0 24px 0;
}
.modal-specs {
  white-space: pre-line;
  line-height: 1.8;
  font-size: 15px;
  color: #333;
  border-top: 1px solid #e5e5e5;
  padding-top: 20px;
  margin-bottom: 24px;
}
.modal-gifts {
  background: #f8f8f8;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 24px;
  border-left: 3px solid #111;
}
.modal-buy-btn {
  width: 100%;
  padding: 16px;
  background: #111;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
}
.modal-buy-btn:hover {
  background: #333;
}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.announce{background:var(--lime);padding:9px 18px;text-align:center;font-size:10px;letter-spacing:1.4px;font-weight:800;text-transform:uppercase}
header{position:sticky;top:0;z-index:20;background:rgba(242,241,235,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{height:76px;max-width:1400px;margin:auto;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;gap:25px}
.logo{font:900 34px/.8 var(--display);letter-spacing:-1.4px}.logo span{color:var(--red)}.logo small{display:block;font:700 8px var(--body);letter-spacing:2.3px;margin-top:7px}
.navlinks{display:flex;gap:27px;align-items:center;font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:800}.navlinks a:hover{color:#758e00}
.navright{display:flex;align-items:center;gap:18px;font-size:11px;font-weight:800;text-transform:uppercase}.cartbtn{border:1px solid var(--ink);background:transparent;padding:10px 14px;font-weight:800;font-size:10px;letter-spacing:1px}.cartbtn:hover{background:var(--ink);color:white}
.hero{background:var(--ink);color:white;min-height:610px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.hero-copy{padding:95px 0 85px max(5vw,calc((100vw - 1300px)/2));position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:10px;letter-spacing:3px;font-weight:800;color:var(--lime);text-transform:uppercase;display:flex;align-items:center;gap:10px}.eyebrow:before{content:'';width:25px;height:2px;background:var(--lime)}
h1{font:900 clamp(66px,9vw,132px)/.82 var(--display);letter-spacing:-3px;text-transform:uppercase;margin:27px 0 22px;max-width:700px}h1 em{font-style:normal;color:var(--lime);display:block}
.hero-copy p{max-width:380px;color:#b9bbb2;font-size:13px;line-height:1.8;margin:0 0 30px}
.cta{display:inline-flex;align-items:center;gap:24px;background:var(--lime);color:var(--ink);padding:16px 20px;font-size:10px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;width:max-content;transition:.2s}.cta:hover{transform:translateY(-3px);box-shadow:5px 5px 0 white}.cta b{font-size:18px}
.hero-art{position:relative;min-height:610px;background:linear-gradient(135deg,#272a22,#12140f 65%);overflow:hidden}
.hero-art:before{content:'SKATE';position:absolute;font:900 23vw/.8 var(--display);color:rgba(255,255,255,.035);right:-30px;top:60px;writing-mode:vertical-rl;letter-spacing:-15px}
.hero-photo{position:absolute;inset:0;background:linear-gradient(90deg,rgba(17,18,15,.4),rgba(17,18,15,.04)),url('https://images.unsplash.com/photo-1520045892732-304bc3ac5d8e?auto=format&fit=crop&w=1400&q=85') center/cover;opacity:.8;mix-blend-mode:screen}
.deck-hero{position:absolute;width:150px;height:490px;left:48%;top:52%;transform:translate(-50%,-50%) rotate(24deg);border:8px solid #171814;border-radius:75px;background:linear-gradient(145deg,#d6ff3e,#8fae19 48%,#e5edb9);box-shadow:30px 35px 50px #0009;display:flex;align-items:center;justify-content:center}
.deck-hero:before{content:'82';font:900 130px/.8 var(--display);color:#151710;transform:rotate(90deg);letter-spacing:-12px}.deck-hero:after{content:'SKATEBOARDING';position:absolute;font:800 10px var(--body);letter-spacing:3px;transform:rotate(90deg);bottom:55px;color:#171814}
.hero-stamp{position:absolute;bottom:35px;right:7%;border:1px solid #ffffff66;border-radius:50%;width:112px;height:112px;display:grid;place-items:center;text-align:center;font:800 11px/1.4 var(--display);letter-spacing:1px;transform:rotate(-12deg);color:var(--lime)}
.ticker{background:var(--lime);overflow:hidden;white-space:nowrap;padding:13px 0;font:800 17px var(--display);letter-spacing:2px}.ticker span{padding:0 22px}.ticker i{font-style:normal;color:var(--red)}
.wrap{max-width:1400px;margin:auto;padding:0 5vw}.section{padding:90px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:34px;gap:20px}.kicker{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:900;color:#777}.section-title{font:900 clamp(42px,6vw,72px)/.9 var(--display);text-transform:uppercase;letter-spacing:-1px;margin:10px 0 0}.section-title span{color:#92958a}.text-link{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--ink);padding-bottom:7px}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.cat{height:250px;background:#dfe0d5;position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}.cat:nth-child(2){background:#d6e2c6}.cat:nth-child(3){background:#d5d8d6}.cat:nth-child(4){background:#e4d5c9}.cat:hover{transform:translateY(-5px)}.cat-no{font-size:10px;font-weight:800;color:#777}.cat h3{font:900 36px/.9 var(--display);margin:0;text-transform:uppercase;position:relative;z-index:2}.cat-art{position:absolute;width:90px;height:200px;right:28px;top:20px;border:6px solid #222;border-radius:48px;transform:rotate(28deg);background:linear-gradient(160deg,#a9c92d,#222 80%);box-shadow:12px 15px 18px #0003}.cat:nth-child(2) .cat-art{background:linear-gradient(160deg,#d35d44,#f3c99e)}.cat:nth-child(3) .cat-art{height:130px;width:130px;border-radius:50%;top:55px;background:radial-gradient(circle,#d9ff3e 0 22%,#171814 24% 48%,#d9d9d0 50%)}.cat:nth-child(4) .cat-art{height:60px;width:160px;border-radius:15px;top:90px;background:linear-gradient(90deg,#111,#666,#111)}
.catalog{background:#e8e8df}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:25px}.filter{border:1px solid #bcbeb4;background:transparent;padding:10px 15px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}.filter.active,.filter:hover{background:var(--ink);color:white;border-color:var(--ink)}

/* THẺ SẢN PHẨM TỐI GIẢN NGOÀI TRANG CHỦ (ẢNH, TÊN, GIÁ) */
.product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.product{background:var(--paper);position:relative;min-width:0;cursor:pointer;transition:.2s}
.product:hover{transform:translateY(-3px)}
.product-visual{height:280px;display:grid;place-items:center;position:relative;overflow:hidden;background:#f4f4f4}
.product-info{padding:15px 14px 17px;text-align:left}
.product-name{font:800 16px/1.1 var(--display);text-transform:uppercase;margin:0 0 6px 0;color:#111;min-height:35px}
.price{font-size:14px;font-weight:900;color:#111}

.feature{background:var(--lime);display:grid;grid-template-columns:1fr 1fr;min-height:420px}.feature-left{padding:75px max(5vw,calc((100vw - 650px)/2)) 75px max(5vw,calc((100vw - 1300px)/2));display:flex;flex-direction:column;justify-content:center}.feature h2{font:900 clamp(52px,7vw,90px)/.84 var(--display);text-transform:uppercase;letter-spacing:-2px;margin:22px 0}.feature p{font-size:13px;line-height:1.8;max-width:420px}.feature-right{background:var(--ink);color:white;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.feature-right:before{content:'FIRST PUSH';position:absolute;font:900 16vw var(--display);white-space:nowrap;color:#ffffff0b;transform:rotate(-90deg)}.lesson-card{border:1px solid #ffffff55;padding:32px;max-width:330px;position:relative;z-index:1}.lesson-card strong{font:900 46px var(--display);color:var(--lime)}.lesson-card p{color:#c5c6bd;font-size:12px;line-height:1.8}
.values{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.value{padding:30px 25px;border-right:1px solid var(--line)}.value:last-child{border:0}.value b{font:900 27px var(--display);text-transform:uppercase}.value p{font-size:11px;line-height:1.7;color:#686b62;margin-bottom:0}
.footer{background:var(--ink);color:white;padding:65px 0 25px}.footer-top{display:flex;justify-content:space-between;gap:40px;padding-bottom:55px}.footer .logo{font-size:42px}.footer p{font-size:11px;color:#aeb0a6;line-height:1.8;max-width:330px}.footer-links{display:flex;gap:55px}.footer-links div{display:flex;flex-direction:column;gap:13px}.footer-links b{font-size:9px;letter-spacing:2px;color:var(--lime);margin-bottom:6px}.footer-links a{font-size:11px;color:#d0d1ca}.copyright{border-top:1px solid #ffffff26;padding-top:18px;display:flex;justify-content:space-between;color:#85877e;font-size:9px;letter-spacing:1px}
.cart-panel{position:fixed;inset:0;z-index:50;pointer-events:none}.cart-panel.open{pointer-events:auto}.shade{position:absolute;inset:0;background:#0008;opacity:0;transition:.25s}.cart-panel.open .shade{opacity:1}.drawer{position:absolute;right:0;top:0;height:100%;width:min(440px,100%);background:var(--paper);padding:25px;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column}.cart-panel.open .drawer{transform:none}.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:17px}.drawer-head h3{font:900 34px var(--display);margin:0}.close{background:none;border:0;font-size:24px}.cart-items{overflow:auto;flex:1;padding:15px 0}.cart-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.cart-row b{font:800 16px var(--display);display:block}.cart-row small{color:#777;font-size:10px}.qty{display:flex;align-items:center;gap:8px;margin-top:8px}.qty button{border:1px solid var(--line);background:none;width:23px;height:23px}.cart-bottom{border-top:1px solid var(--line);padding-top:18px}.total{display:flex;justify-content:space-between;font-weight:900;margin-bottom:15px}.checkout{width:100%;border:0;background:var(--lime);padding:16px;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:white;padding:13px 18px;font-size:11px;z-index:70;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.navlinks{display:none}.hero{grid-template-columns:1fr}.hero-copy{padding:75px 7vw 55px}.hero-art{min-height:390px}.deck-hero{height:350px;width:115px}.category-grid,.product-grid{grid-template-columns:repeat(2,1fr)}.feature{grid-template-columns:1fr}.feature-left{padding:60px 7vw}.feature-right{min-height:300px}.footer-top{flex-direction:column}.footer-links{gap:35px}}
@media(max-width:520px){.nav{height:66px;padding:0 5vw}.logo{font-size:29px}.navright{gap:10px}.navright>a{display:none}.hero-copy{padding-top:65px}.hero-art{min-height:330px}h1{font-size:75px}.section{padding:65px 0}.section-head{align-items:start;flex-direction:column}.category-grid{gap:8px}.cat{height:190px;padding:13px}.cat h3{font-size:29px}.cat-art{right:14px;width:66px;height:150px}.product-grid{gap:8px}.product-visual{height:190px}.product-name{font-size:16px}.product-info{padding:12px 10px}.values{grid-template-columns:1fr}.value{border-right:0;border-bottom:1px solid var(--line);padding:22px 5px}.footer-links{gap:25px}.copyright{gap:15px;flex-direction:column}}
</style>
</head>
